name: Deploy static site

# Downloads the county exports, builds the county DBs, exports site/data and
# publishes site/ to Cloudflare Pages. Runs monthly and on demand.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   secrets   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#             CLOUDFLARE_ACCOUNT_ID
#   variable  CF_PAGES_PROJECT       Pages project name (create it once in the
#                                    Cloudflare dashboard as a "Direct Upload" project)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 2 * *"  # 09:17 UTC on the 2nd of each month

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && pytest -q
      - name: Download county data
        run: python scripts/fetch_data.py
      - name: Build county databases
        run: for c in dallas collin tarrant denton; do python pipeline/build_db.py "$c"; done
      - name: Export static data
        run: python pipeline/export_static.py
      - name: Check Cloudflare Pages limits (20,000 files, 25 MiB each)
        run: |
          files=$(find site -type f | wc -l); echo "files: $files"
          test "$files" -lt 20000
          test -z "$(find site -type f -size +25M)"
      - name: Publish to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
